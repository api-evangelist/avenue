aid: avenue
name: Avenue
description: >-
  Avenue is an operations observability and workflow-automation platform that
  helps operations, RevOps, and support teams detect problems and act on them in
  real time. It connects to the tools and databases a business already runs on
  (Postgres, Google Sheets, Salesforce, Zendesk, Slack, Linear, Asana, Notion),
  watches for issues using custom rules and thresholds, and routes alerts into a
  shared task queue where teams triage and resolve them. A drag-and-drop playbook
  builder and an operational AI copilot automate routine responses, while metrics
  track resolution over time. Avenue is used by operations leaders at
  marketplaces, fintech, and healthcare companies. It was founded in 2021 and is
  backed by Y Combinator, Slack Fund, Accel, and Flexport.
