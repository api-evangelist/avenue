aid: avenue
name: Avenue
description: >-
  Avenue is an operations observability and workflow-automation platform that
  helps operations, RevOps, and support teams detect problems and act on them in
  real time. It connects to the tools and databases a business already runs on
  (Postgres, Google Sheets, Salesforce, Zendesk, Slack, Linear, Asana, Notion),
  watches for issues using custom rules and thresholds, and routes alerts into a
  shared task queue where teams triage and resolve them. A drag-and-drop playbook
  builder and an operational AI copilot automate routine responses, while metrics
  track resolution over time. Avenue is used by operations leaders at
  marketplaces, fintech, and healthcare companies. It was founded in 2021 by
  Justin Bleuel and Jeff Barg, and was backed by Y Combinator, Slack Fund, Accel,
  Flexport, Lachy Groom, and Elad Gil. Avenue was acquired by Clay in January 2025
  and the product has since been wound down: the marketing site at avenue.app is
  still served but frozen at "© 2024 Avenue", the application host
  app.useavenue.com returns HTTP 404 "Application not found", and the Intercom help
  center at docs.useavenue.com returns HTTP 403. Avenue never published a public
  API, OpenAPI specification, SDK, MCP server, or agent card; the only developer-
  facing surface it documented was inbound and outbound webhooks.
